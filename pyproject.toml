[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-cli"
version = "2.0.0"
description = "Local Chrome commands, paged reader, PNG screenshots and persistent seven-tool MCP"
requires-python = ">=3.10"
dependencies = ["playwright>=1.64,<2", "httpx>=0.27,<1", "markdownify>=1.2,<2", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "setuptools>=68", "wheel"]

[project.scripts]
omni = "omni.cli:main"
omni-mcp = "omni.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omni.browser" = ["refs.js"]
"omni._vendor.browser_use_dom" = ["LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
