<!doctype html><meta charset="utf-8"><title>Interactive fixture</title>
<main><h1>Fixture controls</h1><p>Readable local fixture.</p>
<label for="query">Search label</label><input id="query" value="PRIVATE_INITIAL">
<input aria-label="Password" type="password" value="PRIVATE_PASSWORD">
<textarea aria-label="Notes">PRIVATE_NOTES</textarea>
<div contenteditable="true" aria-label="Editor">PRIVATE_EDITOR</div>
<button id="submit" onclick="document.querySelector('#result').textContent='Submitted'; this.dataset.clicks=Number(this.dataset.clicks||0)+1">Submit</button>
<button disabled>Disabled</button><button aria-disabled="true">ARIA disabled</button>
<input type="hidden" value="PRIVATE_HIDDEN"><button hidden>Hidden button</button>
<div inert><button>Inert button</button></div>
<div style="visibility:hidden"><button>Invisible button</button></div>
<p id="result">Not submitted</p>
<a id="pdf" href="/protected/file.pdf" download>Download PDF</a>
<a id="other" href="/content.html">Other page</a>
<select aria-label="Choice"><option>First</option><option>Second</option></select>
<span id="shadow"></span>
<button style="margin-top:1500px" id="offscreen" onclick="this.textContent='Offscreen clicked'">Offscreen</button>
</main>
<dialog open><p>Cookie consent remains visible</p><button>Accept cookies</button></dialog>
<iframe title="Unsupported frame" src="/frame"></iframe>
<script>
document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML = '<h2>Shadow content</h2><label>Shadow field<input id="inside"></label><button onclick="this.textContent=\'Shadow clicked\'">Shadow button</button><a href="/protected/file.pdf">Shadow PDF</a>';
</script>
