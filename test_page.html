<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OmniBrowser v3 Comprehensive Test</title>
  <style>
    .hidden-radio { opacity: 0; width: 0; height: 0; position: absolute; }
    .custom-label { padding: 8px 12px; background: #eee; cursor: pointer; display: inline-block; }
    .scroll-box { height: 80px; width: 200px; overflow-y: scroll; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>OmniBrowser v3 Test Suite</h1>

  <!-- Scoped test section -->
  <div id="test-form">
    <!-- ViewState and noise bloat to test cleaner -->
    <input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="dDwxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ejAxMjM0NTY3ODk=" />
    <input type="hidden" name="__EVENTVALIDATION" value="eWVzLXRoaXMtaXMtYS12ZXJ5LWxvbmctc3RyaW5nLXRoYXQtc2hvdWxkLWJlIHRydW5jYXRlZC1ieS10aGUtb2JzZXJ2ZS1jbGVhbmVyLW1vZHVsZS1pbi1vbW5pLXYz" />

    <!-- Base64 image bloat -->
    <p>Image below:</p>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Base64 sample" />
    <p>Text with inline data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg== embedded</p>

    <!-- Text input -->
    <div>
      <label for="username">Username:</label>
      <input id="username" type="text" placeholder="Enter username" />
    </div>

    <!-- Hidden styled radio (opacity: 0) -->
    <div>
      <input type="radio" name="plan" id="plan_pro" value="pro" class="hidden-radio" />
      <label for="plan_pro" class="custom-label" id="label_pro">Pro Plan</label>

      <input type="radio" name="plan" id="plan_free" value="free" class="hidden-radio" />
      <label for="plan_free" class="custom-label" id="label_free">Free Plan</label>
    </div>

    <!-- Native select dropdown -->
    <div>
      <label for="country">Country:</label>
      <select id="country">
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="vn">Vietnam</option>
      </select>
    </div>

    <!-- Scrollable container -->
    <div id="inner-scroll" class="scroll-box">
      <div style="height: 300px;">
        Scrollable content top
        <div style="margin-top: 150px;" id="scroll-target">Scrollable content target</div>
      </div>
    </div>

    <button id="btn_submit">Submit Application</button>
  </div>

  <div id="output-log" style="margin-top: 20px; font-family: monospace;"></div>

  <script>
    const log = document.getElementById("output-log");
    document.getElementById("plan_pro").addEventListener("change", () => {
      log.innerText += "Radio changed to: pro\n";
    });
    document.getElementById("country").addEventListener("change", (e) => {
      log.innerText += "Country changed to: " + e.target.value + "\n";
    });
    document.getElementById("btn_submit").addEventListener("click", () => {
      log.innerText += "Submitted! Username=" + document.getElementById("username").value + "\n";
    });
  </script>
</body>
</html>
